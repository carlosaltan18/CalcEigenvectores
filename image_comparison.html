<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#f4f0e9;background:#111518;font:14px system-ui,sans-serif}header,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}header{justify-content:space-between;font-family:"Courier New",monospace;letter-spacing:.04em}small{color:#a8afb5}select,input{accent-color:#ff8a1f}select{padding:8px;border:1px solid #485159;border-radius:2px;background:#171c20;color:#f4f0e9;max-width:100%}label{font-weight:700;color:#e6e1d8}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ff8a1f;outline-offset:3px}.viewport{height:460px;border:1px solid #424a51;border-radius:2px;background:#0b0d0f;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;box-shadow:inset 0 0 34px #000}.stage{position:relative;flex:none;--split:50%}.stage img{position:absolute;width:100%;height:100%;inset:0;display:block;user-select:none;pointer-events:none}.stage .before{clip-path:inset(0 calc(100% - var(--split)) 0 0)}.divider{position:absolute;left:var(--split);top:0;height:100%;width:3px;background:#ff8a1f;transform:translateX(-50%);box-shadow:0 0 11px #ff8a1f;pointer-events:none}.divider:after{content:'↔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 8px;border-radius:2px;background:#f04b2b;color:white}.stage.slider{touch-action:pan-y;cursor:ew-resize}.badge{position:absolute;top:8px;background:#12171bd9;border-left:2px solid #ff8a1f;color:#f4f0e9;padding:5px 8px;border-radius:0;font:700 11px "Courier New",monospace;letter-spacing:.03em;max-width:47%}.left{left:8px}.right{right:8px}.side{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;height:100%}.panel{position:relative;flex:none}.panel img{width:100%;height:100%;display:block}.position{display:flex;gap:12px;align-items:center;margin-top:14px}.position input{flex:1;min-width:60px;min-height:28px}p{margin:8px 0;color:#a8afb5;font-size:12px}[hidden]{display:none!important}@media(max-width:480px){.viewport{padding:6px}.badge{font-size:10px;padding:4px}.controls{gap:6px}}
</style></head><body data-key="@@KEY@@">
<header><strong>@@TITLE@@</strong><small>@@WIDTH@@ × @@HEIGHT@@ px · RGB</small></header>
<div class="controls"><label for="mode">Vista</label><select id="mode"><option value="slider">Deslizador</option><option value="side">Lado a lado</option><option value="diff">Diferencia</option><option value="amp">Amplificada ×4</option></select></div>
<div class="viewport" id="viewport">
 <div class="stage slider" id="stage"><img data-image="right" alt="Reconstrucción @@TITLE@@" id="result"><img data-image="left" alt="@@LABEL@@" class="before" id="before"><div class="divider" id="divider"></div><span class="badge left" id="leftLabel">@@LABEL@@</span><span class="badge right" id="rightLabel">Reconstrucción</span></div>
 <div class="side" id="side" hidden><div class="panel"><img data-image="left" alt="@@LABEL@@"><span class="badge left">@@LABEL@@</span></div><div class="panel"><img data-image="right" alt="Reconstrucción @@TITLE@@"><span class="badge right">Reconstrucción</span></div></div>
</div>
<div class="position" id="position"><label for="split">Divisor</label><input id="split" type="range" min="0" max="100" value="50" aria-label="Posición del divisor: original a la izquierda"><output id="percent" for="split">50%</output></div>
<p id="hint">Arrastra sobre la imagen o usa el divisor con las flechas del teclado.</p>
<script>
const mode=document.getElementById('mode'),stage=document.getElementById('stage'),side=document.getElementById('side'),viewport=document.getElementById('viewport'),split=document.getElementById('split');
const result=document.getElementById('result'),before=document.getElementById('before'),divider=document.getElementById('divider'),leftLabel=document.getElementById('leftLabel'),rightLabel=document.getElementById('rightLabel');
const sources={left:'@@LEFT@@',slider:'@@RIGHT@@',diff:'@@DIFF@@',amp:'@@AMP@@'};
for (const img of document.querySelectorAll('[data-image]')) img.src=img.dataset.image==='left'?sources.left:sources.slider;
const reconstructionAlt=result.alt;
const key='image-inspector:'+document.body.dataset.key;
try{const saved=JSON.parse(sessionStorage.getItem(key));if(saved){if(['slider','side','diff','amp'].includes(saved.mode))mode.value=saved.mode;split.value=Number.isFinite(+saved.split)?saved.split:50;}}catch(e){}
function save(){try{sessionStorage.setItem(key,JSON.stringify({mode:mode.value,split:split.value}));}catch(e){}}
function size(){const double=mode.value==='side', padding=innerWidth<=480?12:24;const width=Math.max(1,viewport.clientWidth-padding-(double?12:0))/(double?2:1);const scale=Math.min(width/@@WIDTH@@,(viewport.clientHeight-padding)/@@HEIGHT@@);for(const el of [stage,...document.querySelectorAll('.panel')]){el.style.width=(@@WIDTH@@*scale)+'px';el.style.height=(@@HEIGHT@@*scale)+'px';}}
function position(){stage.style.setProperty('--split',split.value+'%');document.getElementById('percent').value=split.value+'%';save();}
function update(){const slider=mode.value==='slider',isSide=mode.value==='side';stage.hidden=isSide;side.hidden=!isSide;stage.classList.toggle('slider',slider);for(const el of [before,divider,leftLabel,document.getElementById('position')])el.hidden=!slider;result.src=sources[mode.value]||sources.slider;result.alt=slider?reconstructionAlt:mode.options[mode.selectedIndex].text;rightLabel.textContent=slider?'Reconstrucción':mode.options[mode.selectedIndex].text;document.getElementById('hint').textContent=slider?'Arrastra sobre la imagen o usa el divisor con las flechas del teclado.':isSide?'Ambas imágenes usan la misma escala y muestran el encuadre completo.':'Error absoluto por canal RGB · negro = sin diferencia'+(mode.value==='amp'?' · ×4, limitado a 255.':'.');size();position();}
function drag(e){const rect=stage.getBoundingClientRect();split.value=Math.round(Math.max(0,Math.min(100,100*(e.clientX-rect.left)/rect.width)));position();}
stage.addEventListener('pointerdown',e=>{if(mode.value!=='slider')return;stage.setPointerCapture(e.pointerId);drag(e);});stage.addEventListener('pointermove',e=>{if(stage.hasPointerCapture(e.pointerId))drag(e);});
split.addEventListener('input',position);mode.addEventListener('change',update);new ResizeObserver(size).observe(viewport);update();
</script></body></html>
